[package]
name = "expose-desktop"
description = "Expose desktop application (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Rule: this is the only package that may use Tauri.

[lib]
name = "expose_desktop"
path = "src/lib.rs"

[[bin]]
name = "expose-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[lints]
workspace = true
