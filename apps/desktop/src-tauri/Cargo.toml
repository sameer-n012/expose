[package]
name = "expose-desktop"
description = "Expose desktop application (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Rule: this is the only package that may use Tauri.

[lib]
name = "expose_desktop"
path = "src/lib.rs"

[[bin]]
name = "expose-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native folder picker for import (MIT OR Apache-2.0).
tauri-plugin-dialog = "2"
expose-catalog.workspace = true
# Reads photo metadata at import. Enables `rawler` (LGPL-2.1) by default;
# this is the approved exception (ADR 0004).
expose-raw.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Writes `tracing` events to stderr (MIT).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
